<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to QUEST - Your Journey Begins</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;">
        <div class="glass-card" style="width: 100%; max-width: 580px; text-align: center; padding: 40px;">
            <span class="badge badge-pink" style="margin-bottom: 12px; display: inline-block;">🎉 Profile Ready</span>
            
            <h1 style="font-size: 32px; font-weight: 900; margin-bottom: 6px;">
                Welcome to QUEST, <span th:text="${user.fullName}" style="color: #db2777;">User</span>!
            </h1>
            <p style="color: #94a3b8; font-size: 15px; margin-bottom: 24px;">Your personalized career journey is fully configured.</p>

            <div style="background: rgba(15, 23, 42, 0.9); border: 1px solid var(--border-card); border-radius: 12px; padding: 20px; text-align: left; margin-bottom: 28px;">
                <div style="margin-bottom: 12px;">
                    <span style="font-size: 12px; color: #64748b; font-weight: 700;">QUEST PROFILE ID</span>
                    <div style="font-size: 18px; font-weight: 800; color: #6366f1;" th:text="${user.questProfileId}">QUEST-10482</div>
                </div>

                <div style="margin-bottom: 12px;">
                    <span style="font-size: 12px; color: #64748b; font-weight: 700;">TARGET CAREER GOAL</span>
                    <div style="font-size: 16px; font-weight: 700; color: #f8fafc;" th:text="${profile.careerGoal}">Full-Stack Developer</div>
                </div>

                <div>
                    <span style="font-size: 12px; color: #64748b; font-weight: 700;">ACTIVE SKILLS</span>
                    <div style="font-size: 14px; color: #cbd5e1;" th:text="${profile.currentSkills}">Java, SQL</div>
                </div>
            </div>

            <a href="/dashboard" class="btn btn-primary" style="padding: 14px 32px; font-size: 16px;">🚀 Start My Journey</a>
        </div>
    </div>
</body>
</html>
