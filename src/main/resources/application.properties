# Application Info
spring.application.name=QUEST
server.port=8080

# Database Configuration (MySQL quest_db)
spring.datasource.url=jdbc:mysql://localhost:3360/quest_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Fallback H2 settings (if MySQL profile fallback active)
# spring.datasource.url=jdbc:h2:mem:quest_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE

# Thymeleaf Settings
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# File Upload Multipart Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Custom Application Upload Storage Path
quest.upload.dir=C:/Users/ELCOT/.gemini/antigravity/scratch/QUEST/uploads
