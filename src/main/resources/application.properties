# Application Info
spring.application.name=QUEST
server.port=8080

# Database Configuration (MySQL quest_db)
spring.datasource.url=jdbc:h2:mem:quest_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA / Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# Fallback H2 settings (if MySQL profile fallback active)
# spring.datasource.url=jdbc:h2:mem:quest_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE

# Thymeleaf Settings
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# File Upload Multipart Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Custom Application Upload Storage Path
quest.upload.dir=C:/Users/ELCOT/.gemini/antigravity/scratch/QUEST/uploads
