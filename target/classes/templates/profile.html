<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - QUEST</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="/dashboard" class="nav-brand"><span>🚀 QUEST</span></a>
        <ul class="nav-links">
            <li><a href="/dashboard" class="nav-link">Dashboard</a></li>
            <li><a href="/career" class="nav-link">Career & Skills</a></li>
            <li><a href="/opportunities" class="nav-link">Opportunities</a></li>
            <li><a href="/interview" class="nav-link">AI Mock Interview</a></li>
            <li><a href="/safety-health" class="nav-link">Safety & Health</a></li>
            <li th:if="${user.gender == 'Female'}"><a href="/menstrual-health" class="nav-link" style="color: #f472b6;">🌸 Menstrual Health</a></li>
            <li><a href="/notifications" class="nav-link">🔔 Notifications</a></li>
        </ul>
        <div class="user-badge">
            <img th:src="${user.profilePhoto.startsWith('http') || user.profilePhoto.startsWith('/') ? user.profilePhoto : 'https://api.dicebear.com/7.x/bottts/svg?seed=' + user.fullName}" class="user-avatar" alt="Avatar">
            <div>
                <div style="font-size: 13px; font-weight: 700;" th:text="${user.fullName}">Alex</div>
                <div style="font-size: 11px; color: #94a3b8;" th:text="${user.questProfileId}">QUEST-10482</div>
            </div>
        </div>
    </nav>

    <div class="main-container">
        <div class="section-header">
            <h1 class="section-title">👤 My QUEST Profile</h1>
            <p class="section-subtitle">Manage your personal credentials, career goals, and skills.</p>
        </div>

        <div class="glass-card" style="max-width: 800px; margin: 0 auto;">
            <div style="display: flex; align-items: center; gap: 20px; margin-bottom: 28px; padding-bottom: 20px; border-bottom: 1px solid var(--border-card);">
                <img th:src="${user.profilePhoto.startsWith('http') || user.profilePhoto.startsWith('/') ? user.profilePhoto : 'https://api.dicebear.com/7.x/bottts/svg?seed=' + user.fullName}" style="width: 72px; height: 72px; border-radius: 50%; border: 3px solid var(--accent-pink); object-fit: cover;">
                <div>
                    <h2 style="font-size: 22px; font-weight: 800;" th:text="${user.fullName}">User Name</h2>
                    <span class="badge badge-indigo" th:text="${user.questProfileId}">QUEST-10482</span>
                    <span class="badge badge-pink" th:text="${user.gender}">Gender</span>
                </div>
            </div>

            <form id="edit-profile-form">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                    <div class="form-group">
                        <label class="form-label">Full Name</label>
                        <input type="text" id="fullName" class="form-control" th:value="${user.fullName}" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Email Address (Read-only)</label>
                        <input type="email" class="form-control" th:value="${user.email}" readonly style="opacity: 0.7;">
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                    <div class="form-group">
                        <label class="form-label">Phone</label>
                        <input type="text" id="phone" class="form-control" th:value="${user.phone}">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Age</label>
                        <input type="number" id="age" class="form-control" th:value="${user.age}">
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                    <div class="form-group">
                        <label class="form-label">Education</label>
                        <input type="text" id="education" class="form-control" th:value="${profile.education}">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Current Status</label>
                        <input type="text" id="currentStatus" class="form-control" th:value="${profile.currentStatus}">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Career Goal</label>
                    <input type="text" id="careerGoal" class="form-control" th:value="${profile.careerGoal}">
                </div>

                <div class="form-group">
                    <label class="form-label">Current Skills</label>
                    <input type="text" id="currentSkills" class="form-control" th:value="${profile.currentSkills}">
                </div>

                <div class="form-group">
                    <label class="form-label">Interested Skills</label>
                    <input type="text" id="interestedSkills" class="form-control" th:value="${profile.interestedSkills}">
                </div>

                <div class="form-group">
                    <label class="form-label">Projects</label>
                    <textarea id="projects" class="form-control" rows="3" th:text="${profile.projects}"></textarea>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px;">Update Profile Data</button>
            </form>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        document.getElementById('edit-profile-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fullName = document.getElementById('fullName').value;
            const phone = document.getElementById('phone').value;
            const age = document.getElementById('age').value;
            const education = document.getElementById('education').value;
            const currentStatus = document.getElementById('currentStatus').value;
            const careerGoal = document.getElementById('careerGoal').value;
            const currentSkills = document.getElementById('currentSkills').value;
            const interestedSkills = document.getElementById('interestedSkills').value;
            const projects = document.getElementById('projects').value;

            const res = await apiRequest('/api/profile', 'PUT', {
                fullName, phone, age, education, currentStatus, careerGoal,
                currentSkills, interestedSkills, projects
            });

            if (res.success) {
                alert('Profile updated successfully!');
            }
        });
    </script>
</body>
</html>
