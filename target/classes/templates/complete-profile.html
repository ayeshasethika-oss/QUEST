<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Your Profile - QUEST</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div style="min-height: 100vh; padding: 40px 20px;">
        <div class="glass-card" style="max-width: 720px; margin: 0 auto;">
            <div style="text-align: center; margin-bottom: 28px;">
                <span class="badge badge-pink">Step 2 of 2</span>
                <h1 style="font-size: 28px; font-weight: 800; margin-top: 10px;">👤 Complete Your QUEST Profile</h1>
                <p style="color: #94a3b8; font-size: 14px;">Configure your career goals and active skill set to unlock your personalized roadmap.</p>
            </div>

            <div id="alert-box" style="display:none; padding: 10px; margin-bottom: 16px; border-radius: 8px; font-size: 13px; text-align: center;"></div>

            <form id="profile-form">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                    <div class="form-group">
                        <label class="form-label">Education Qualification</label>
                        <input type="text" id="education" class="form-control" placeholder="B.Tech in Computer Science" required th:value="${profile.education}">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Current Status</label>
                        <select id="currentStatus" class="form-control" required th:value="${profile.currentStatus}">
                            <option value="Student">Student</option>
                            <option value="Employed">Employed</option>
                            <option value="Unemployed">Unemployed</option>
                            <option value="Career Break">Career Break</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Career Goal</label>
                    <input type="text" id="careerGoal" class="form-control" placeholder="Type your goal, e.g., Full-Stack Developer, Data Analyst..." required th:value="${profile.careerGoal}">
                    <div style="font-size: 12px; color: #94a3b8; margin-top: 4px;">Suggestions: Software Engineer, Data Scientist, Cloud Architect, Cybersecurity Specialist</div>
                </div>

                <div class="form-group">
                    <label class="form-label">Current Skills (comma separated)</label>
                    <input type="text" id="currentSkills" class="form-control" placeholder="Java, SQL, Communication..." required th:value="${profile.currentSkills}">
                </div>

                <div class="form-group">
                    <label class="form-label">Interested Skills to Learn (comma separated)</label>
                    <input type="text" id="interestedSkills" class="form-control" placeholder="Spring Boot, Python, AWS..." th:value="${profile.interestedSkills}">
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                    <div class="form-group">
                        <label class="form-label">Years of Experience</label>
                        <input type="text" id="experience" class="form-control" placeholder="e.g., 2 years / Fresh Graduate" th:value="${profile.experience}">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Preferred Career Area</label>
                        <input type="text" id="preferredCareerArea" class="form-control" placeholder="e.g., Backend Engineering" th:value="${profile.preferredCareerArea}">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Projects & Key Accomplishments</label>
                    <textarea id="projects" class="form-control" rows="3" placeholder="Summarize major projects or portfolio work..." th:text="${profile.projects}"></textarea>
                </div>

                <div class="form-group" style="background: rgba(255, 255, 255, 0.03); padding: 16px; border-radius: 8px; border: 1px solid var(--border-card);">
                    <label style="display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 14px; font-weight: 600;">
                        <input type="checkbox" id="careerBreak" th:checked="${profile.careerBreak}" style="width: 18px; height: 18px;">
                        I am returning to work after a Career Break
                    </label>
                    <input type="text" id="careerBreakReason" class="form-control" placeholder="Reason (e.g., Upskilling, Family Care, Higher Studies)" style="margin-top: 10px;" th:value="${profile.careerBreakReason}">
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px; font-size: 16px;">Save Profile & Unlock Journey</button>
            </form>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        document.getElementById('profile-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const education = document.getElementById('education').value;
            const currentStatus = document.getElementById('currentStatus').value;
            const careerGoal = document.getElementById('careerGoal').value;
            const currentSkills = document.getElementById('currentSkills').value;
            const interestedSkills = document.getElementById('interestedSkills').value;
            const experience = document.getElementById('experience').value;
            const preferredCareerArea = document.getElementById('preferredCareerArea').value;
            const projects = document.getElementById('projects').value;
            const careerBreak = document.getElementById('careerBreak').checked;
            const careerBreakReason = document.getElementById('careerBreakReason').value;

            const res = await apiRequest('/api/profile', 'PUT', {
                education, currentStatus, careerGoal, currentSkills,
                interestedSkills, experience, preferredCareerArea, projects,
                careerBreak, careerBreakReason
            });

            if (res.success) {
                window.location.href = '/welcome';
            } else {
                showAlert(res.message, 'danger');
            }
        });
    </script>
</body>
</html>
